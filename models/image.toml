# models/image.toml — canonical `image_gen` model manifest (issues #111, #112, #114).
#
# Single source of truth for the alias roster: RockBot embeds this file at
# build time (see `crate-rockbot/src/image_manifest.rs`) and the Leptos UI
# consumes the same schema. Do not duplicate alias strings in code or config —
# `[[image_providers]]` only supplies credentials/base URLs.
#
# Alias ≠ provider: one alias owns an ordered list of `[[model.route]]`
# entries. Each route names the provider entry, the slugs per operation, and
# an optional tier. The first route flagged `default`, else the first route,
# is preferred; edit calls prefer routes with a dedicated `edit` slug.
#
# Verification (2026-11-05, roster #114): every OpenRouter slug checked against
# `GET /api/v1/images/models`; every fal slug checked against the fal model
# registry (`https://fal.ai/api/models`). `edit = ""` means the route is
# generate-only — it is not a broken reference.
version = "2026-11-05.1"

# ------------------------------- GPT Image -------------------------------

[[model]]
alias = "gptimage"
label = "GPT Image 2.6 · Flare"
family = "openai"
version = "2.6"
default = true
ratios = ["16:9", "2:3", "1:1", "4:3", "3:4", "3:2"]
tags = ["general", "text-rendering"]
notes = "Default. Best general-purpose choice; use for legible text in the image. fal-only route."

  [[model.route]]
  provider = "fal"
  generate = "openai/gpt-image-2.6/flare/text-to-image"
  edit = "openai/gpt-image-2.6/flare/edit"

[[model]]
alias = "sunburst"
label = "GPT Image 2.6 · Sunburst"
family = "openai"
version = "2.6"
ratios = ["16:9", "2:3", "1:1", "4:3", "3:4", "3:2"]
tags = ["general", "detail"]
notes = "Detail-oriented sibling of gptimage (dense compositions, consistent edits). fal-only route."

  [[model.route]]
  provider = "fal"
  generate = "openai/gpt-image-2.6/sunburst/text-to-image"
  edit = "openai/gpt-image-2.6/sunburst/edit"

