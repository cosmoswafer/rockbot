tags = ["general", "detail"]
notes = "Detail-oriented sibling of gptimage (dense compositions, consistent edits)."

  [[model.route]]
  provider = "openrouter"
  generate = "openai/gpt-image-2.6-sunburst"
  edit = "openai/gpt-image-2.6-sunburst"

  [[model.route]]
  provider = "fal"
  generate = "openai/gpt-image-2.6/sunburst/text-to-image"
  edit = "openai/gpt-image-2.6/sunburst/edit"

