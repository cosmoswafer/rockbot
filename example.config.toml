[[chat_providers]]
name = "openrouter"
api_key = "sk-or-v1-EDITME"

[[chat_providers]]
name = "deepseek"
api_key = "EDITME"

[[image_providers]]
name = "openrouter"
api_key = "sk-or-v1-EDITME"

[[image_providers]]
name = "fal"
api_key = "EDITME"

# Global image defaults. The alias roster comes from the canonical manifest
# `models/image.toml` (issues #111/#112) — `default_text_model` is only a
# fallback. `gptimage` is the manifest default (GPT Image 2.6 Flare).
# [image_model]
# default_provider = "fal"
# default_text_model = "gptimage"
# default_edit_model = "gptimage"
# pro_daily_cap = 20
# manifest_path = "./models/image.toml"

[rocketchat.server]
url = "your-server.example.com"
username = "EDITME"
password = "EDITME"

[rocketchat.model]
default_provider = "openrouter"
default_model = "gpt"
# Optional output budget. Omitted ⇒ the model's own default applies.
# max_tokens = 16_384
# max_tokens_retry = 32_768
# max_tokens_summary = 4_096
# retry_on_truncation = true

[webdav]
url = "https://cloud.example.com"
username = "EDITME"
password = "EDITME"
root = "rockbot"

[search]
provider = "exa"

[search.exa]
api_key = "EDITME"

# Optional: delegate tasks to an external ACP agent (e.g. opencode) spawned as
# a subprocess. Disabled by default; `command` required when enabled.
# [acp]
# enabled = true
# command = "deno"
# args = ["x", "opencode-ai", "acp"]
# session_cwd = "/path/to/agent-workspace"
# timeout_secs = 300
# auto_approve_permissions = false
# max_response_chars = 20000


