# default.config.toml — reference documentation only
# This file is NOT read at runtime. All defaults are embedded in Rust source
# (crate-rockbot/src/config.rs). Copy sections you need into your config.toml.

[platform]
name = "rocketchat"

[[chat_providers]]
name = "openrouter"
api_key = ""
base_url = "https://openrouter.ai/api/v1"
basecf_url = ""
chat_path = "/chat/completions"

[chat_providers.models]
gpt = "openai/gpt-oss-120b:online"
qwen = "qwen/qwen3.7-plus"
qwenflash = "qwen/qwen3.7-flash"
minimax = "minimax/minimax-m3"
mimo = "xiaomi/mimo-v2.5"

[[chat_providers]]
name = "deepseek"
api_key = ""
base_url = "https://api.deepseek.com/v1"

[chat_providers.models]
flash = "deepseek-flash"

[[chat_providers]]
name = "llamacpp"
api_key = ""
base_url = "http://localhost:8080/v1"
chat_path = "/chat/completions"

[chat_providers.models]
local = "local-model"

# Image providers supply credentials + endpoints only. The alias roster lives in
# the canonical manifest `models/image.toml` (checked in, embedded at build time,
# issues #111/#112) — do not re-declare aliases here. The legacy `models` /
# `edit_models` maps are still parsed for backwards compatibility but image_gen
# no longer reads them.
[[image_providers]]
name = "openrouter"
api_key = ""
base_url = "https://openrouter.ai/api/v1"
basecf_url = ""
draw_path = "/images"

[[image_providers]]
name = "fal"
api_key = ""
base_url = "https://queue.fal.run"

[image_model]
# Manifest is the source of truth; `default_provider`/`default_text_model` are
# fallbacks used only when the manifest cannot supply a default route.
default_provider = "fal"
default_text_model = "gptimage"
default_edit_model = "gptimage"
# Per-room daily cap on pro-tier generations (0 = unlimited) — issue #112.
pro_daily_cap = 20
# Optional override for the embedded manifest (`models/image.toml`). A path that
# cannot be read aborts boot instead of silently falling back.
# manifest_path = "./models/image.toml"
default_quality = "medium"
default_output_format = "png"
default_num_images = 1
default_image_size = "portrait_2_3"
default_image_size_tier = "4K"

[model]
default_provider = "openrouter"
default_model = "gpt"
max_iterations = 256
max_soul_chars = 5000
memory_ttl_secs = 600
persist_interval_secs = 120
max_context_bytes = 4_000_000
max_attachment_bytes = 25_000_000
model_context_length = 128_000
# Output budget for chat completions. Left commented out ⇒ no `max_tokens`
# field is sent and the model's own default budget applies (issue #117).
# max_tokens = 16_384
# Explicit budget for the single truncation retry (finish_reason = "length").
max_tokens_retry = 32_768
# Output budget for the summarization completion.
max_tokens_summary = 4_096
# Retry once with max_tokens_retry when a completion is truncated or empty.
retry_on_truncation = true
summarization_enabled = true
summarization_ratio = 0.6
summarization_target_tokens = 2_048

[rocketchat.server]
url = "localhost"
username = ""
password = ""

[rocketchat.model]
default_provider = "openrouter"
default_model = "gpt"
max_iterations = 256
max_soul_chars = 5000
memory_ttl_secs = 600
persist_interval_secs = 120
max_context_bytes = 4_000_000
max_attachment_bytes = 25_000_000
model_context_length = 128_000
# Output budget for chat completions. Left commented out ⇒ no `max_tokens`
# field is sent and the model's own default budget applies (issue #117).
# max_tokens = 16_384
# Explicit budget for the single truncation retry (finish_reason = "length").
max_tokens_retry = 32_768
# Output budget for the summarization completion.
max_tokens_summary = 4_096
# Retry once with max_tokens_retry when a completion is truncated or empty.
retry_on_truncation = true
summarization_enabled = true
summarization_ratio = 0.6
summarization_target_tokens = 2_048

[matrix.server]
homeserver = ""
user_id = ""
password = ""
device_id = ""
state_dir = "./tmp/matrix-sdk"

[matrix.model]
default_provider = "openrouter"
default_model = "gpt"
max_iterations = 256
max_soul_chars = 5000
memory_ttl_secs = 600
persist_interval_secs = 120
max_context_bytes = 4_000_000
max_attachment_bytes = 25_000_000
model_context_length = 128_000
# Output budget for chat completions. Left commented out ⇒ no `max_tokens`
# field is sent and the model's own default budget applies (issue #117).
# max_tokens = 16_384
# Explicit budget for the single truncation retry (finish_reason = "length").
max_tokens_retry = 32_768
# Output budget for the summarization completion.
max_tokens_summary = 4_096
# Retry once with max_tokens_retry when a completion is truncated or empty.
retry_on_truncation = true
summarization_enabled = true
summarization_ratio = 0.6
summarization_target_tokens = 2_048

[webdav]
url = ""
username = ""
password = ""
root = ""
dav_path = "/remote.php/dav"
snapshot_prefix = ".snapshots"
# Large-file support (webdav_edit tool). Files at/above stream_threshold_bytes
# use windowed, streamed reads; files above max_edit_bytes are rewritten through
# Nextcloud chunked upload (chunk_size_bytes, v2 minimum 5 MiB).
stream_threshold_bytes = 10485760
max_edit_bytes = 33554432
chunk_size_bytes = 5242880
read_default_lines = 2000
read_max_lines = 2000
read_max_bytes = 65536
read_max_line_chars = 2000
index_checkpoint_lines = 1000

[search]
provider = "exa"

[search.exa]
api_key = ""

[search.brave]
api_key = ""

# ACP (Agent Client Protocol) integration — delegate tasks to an external ACP
# agent spawned as a subprocess over stdio. Disabled by default.
# See docs/dfd/tools/acp-delegate.md.
[acp]
enabled = false

# rockbot starts the ACP agent itself as a subprocess over stdio
# (the protocol's standard transport). `command` is required when enabled.
command = ""                 # executable on PATH or absolute path
args = []                    # argv passed to the agent
env = { }                    # the ONLY env vars passed to the child (besides PATH/HOME)
cwd = "."                    # child process working directory

session_cwd = "."            # cwd passed to session/new (agent's workspace)
timeout_secs = 300           # per-prompt timeout; triggers session/cancel on expiry (10..=3600)
auto_approve_permissions = false  # how to answer session/request_permission
max_response_chars = 20000   # cap aggregated agent output (protect context window)


