[model]
default_provider = "openrouter"
default_model = "gpt"
max_iterations = 47
max_soul_chars = 5000
memory_ttl_secs = 600
persist_interval_secs = 120
max_context_bytes = 4_000_000
max_attachment_bytes = 25_000_000
model_context_length = 128_000
summarization_enabled = true
summarization_ratio = 0.6
summarization_target_tokens = 1024

[rocketchat.server]
url = "localhost"
